# Minimal Python project configuration for linters and type checkers.
# This file centralizes config for ruff and ty.

[project]
name = "aperisolve"
version = "3.14.0"
description = "Open-source steganalysis web platform for automated image analysis and steganography detection"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Zeecka"}
]
dependencies = [
    "Flask>=3.1",
    "Flask-SQLAlchemy>=3.1",
    "numpy",
    "redis",
    "rq",
    "psycopg2-binary",
    "Pillow>=12.3",
    "gunicorn",
    "sentry-sdk[flask,sqlalchemy,rq]",
    "Markdown",
    "Pygments",
    "flask-babel",
    "Flask-Limiter[redis]"
]

[project.optional-dependencies]
# Optional: the `mcp` compose service only. The web app, worker and cron never
# import aperisolve_mcp, so a self-host that does not want the MCP endpoint can
# keep installing without these.
mcp = [
    "mcp>=2.3,<3",
    "httpx",
    # async-redis, not redis: the tools are async, so the limiter uses
    # limits.aio, whose Redis backend is coredis. `limits[redis]` installs the
    # synchronous redis-py the web app's Flask-Limiter uses, and the service
    # crashes at startup with "'coredis' prerequisite not available".
    "limits[async-redis]",
    # Not a feature floor: pydantic-core only began publishing CPython 3.15
    # wheels at 2.48.0, and the runtime image is python:3.15-slim. Resolving
    # any lower pydantic (mcp 2.3's own floor allows 2.13, whose core is
    # 2.46.5) makes `uv sync` build pydantic-core from source, which needs a
    # Rust toolchain and a C linker the image deliberately does not ship —
    # the Docker build fails with `linker cc not found`. pydantic 2.14 pins
    # pydantic-core 2.50.x, which has cp315 manylinux wheels for x86_64 and
    # aarch64. Drop this once mcp's own floor is past it.
    "pydantic>=2.14"
]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "requests",
    # ty consumes these stubs for the flask-sqlalchemy/sqlalchemy dynamic
    # bases; removing them surfaces invalid-argument-type errors.
    "types-Flask-SQLAlchemy",
    "sqlalchemy-stubs"
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

# Only package the application; other top-level dirs (docker/, tests/) must
# not confuse setuptools' flat-layout auto-discovery.
[tool.setuptools.packages.find]
include = ["aperisolve*", "aperisolve_mcp*"]

[tool.uv]
# Every virtualenv release that fixes its open advisories (>=21.14.9, pulled in
# by pre-commit) requires packaging>=26.3, but every coredis 5.x (the newest
# limits[async-redis] allows, coredis<6) caps packaging<26 as a precaution.
# Without this override the lock cannot leave the vulnerable virtualenv
# 21.14.5. Drop it once limits accepts coredis 6 (which allows packaging<27).
override-dependencies = ["packaging>=26.3"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party files live in docker/ (Didier Stevens' pdfid.py, plus the
# autotools config.guess/config.sub) and are copied verbatim into the image.
# They are not our code to lint or reformat.
#
# Ruff 0.16 began formatting Python inside fenced blocks in Markdown, which
# pulls the 46 wiki_content pages into its scope. Those snippets are teaching
# material with deliberately aligned trailing comments, and reflowing them
# rewrites the docs rather than the code. Keep Markdown out of ruff entirely.
extend-exclude = ["docker/", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
# `select = ["ALL"]` opts in to rules that do not exist yet, so each ruff release
# can turn a clean tree red. These three are policy, not defects:
#   CPY001 wants a copyright header in every file; this project carries its terms
#          once, in LICENSE, and has never used per-file notices.
#   D203/D213 are each half of a mutually exclusive pair (with D211/D212). Ruff
#          already resolves them the same way and warns; naming them here keeps
#          the resolution explicit and silences the warning.
ignore = ["CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, magic values and env setup before imports by design.
"tests/*" = ["S101", "INP001", "PLR2004", "E402"]
# Dev-only generator scripts: print output, layout magic numbers, and lighter
# annotation/docstring requirements are fine for standalone tooling.
"scripts/*" = ["T201", "INP001", "PLR2004", "PLR0913", "PLR0917", "ANN", "D", "COM812"]
# Security-review probes (docs/security/*-probe.py): standalone attack scripts
# kept next to the review that cites their output. Same shape as scripts/, plus
# the rules a probe exists to break -- it prints findings, subprocesses itself to
# measure memory, catches bare Exception to report whatever escapes a handler,
# and builds deliberately hostile inputs.
"docs/security/*" = [
    "T201", "INP001", "PLR2004", "PLR0913", "PLR0917", "ANN", "D", "COM812",
    "S101", "S603", "BLE001", "E501", "E402", "PLR0915", "C901", "PERF203",
]

[tool.ty.rules]
# `to_ihdr_bytes` casts three SmallInteger columns to int before handing them to
# bytes(). Whether that cast is needed depends on the environment: drop it and ty
# rejects the list as `list[Column | int]` under some interpreter/stub
# combinations, keep it and newer ty calls it redundant under others. The cast is
# the safe half of that trade (it is required where it is required), so the
# false "redundant" report is downgraded rather than the cast removed.
redundant-cast = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aperisolve", "aperisolve_mcp"]
