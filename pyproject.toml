# Minimal Python project configuration for linters and type checkers.
# This file centralizes config for ruff and ty.

[project]
name = "aperisolve"
version = "3.7.9"
description = "Open-source steganalysis web platform for automated image analysis and steganography detection"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Zeecka"}
]
dependencies = [
    "Flask>=3.1",
    "Flask-SQLAlchemy>=3.1",
    "numpy",
    "redis",
    "rq",
    "psycopg2-binary",
    "Pillow>=12.3",
    "gunicorn",
    "sentry-sdk[flask,sqlalchemy,rq]",
    "Markdown",
    "Pygments",
    "flask-babel",
    "Flask-Limiter[redis]"
]

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "requests",
    # ty consumes these stubs for the flask-sqlalchemy/sqlalchemy dynamic
    # bases; removing them surfaces invalid-argument-type errors.
    "types-Flask-SQLAlchemy",
    "sqlalchemy-stubs"
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

# Only package the application; other top-level dirs (docker/, tests/) must
# not confuse setuptools' flat-layout auto-discovery.
[tool.setuptools.packages.find]
include = ["aperisolve*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party files live in docker/ (Didier Stevens' pdfid.py, plus the
# autotools config.guess/config.sub) and are copied verbatim into the image.
# They are not our code to lint or reformat.
#
# Ruff 0.16 began formatting Python inside fenced blocks in Markdown, which
# pulls the 46 wiki_content pages into its scope. Those snippets are teaching
# material with deliberately aligned trailing comments, and reflowing them
# rewrites the docs rather than the code. Keep Markdown out of ruff entirely.
extend-exclude = ["docker/", "*.md"]

[tool.ruff.lint]
select = ["ALL"]
# `select = ["ALL"]` opts in to rules that do not exist yet, so each ruff release
# can turn a clean tree red. These three are policy, not defects:
#   CPY001 wants a copyright header in every file; this project carries its terms
#          once, in LICENSE, and has never used per-file notices.
#   D203/D213 are each half of a mutually exclusive pair (with D211/D212). Ruff
#          already resolves them the same way and warns; naming them here keeps
#          the resolution explicit and silences the warning.
ignore = ["CPY001", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts, magic values and env setup before imports by design.
"tests/*" = ["S101", "INP001", "PLR2004", "E402"]
# Dev-only generator scripts: print output, layout magic numbers, and lighter
# annotation/docstring requirements are fine for standalone tooling.
"scripts/*" = ["T201", "INP001", "PLR2004", "PLR0913", "PLR0917", "ANN", "D", "COM812"]

[tool.ty.rules]
# `to_ihdr_bytes` casts three SmallInteger columns to int before handing them to
# bytes(). Whether that cast is needed depends on the environment: drop it and ty
# rejects the list as `list[Column | int]` under some interpreter/stub
# combinations, keep it and newer ty calls it redundant under others. The cast is
# the safe half of that trade (it is required where it is required), so the
# false "redundant" report is downgraded rather than the cast removed.
redundant-cast = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aperisolve"]
