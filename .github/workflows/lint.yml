name: Linters

on: [push, pull_request]

# Read-only: nothing in this workflow pushes to the repo or writes checks:
# lint/type/test/audit all just run and report their own exit code. A
# compromised step (e.g. a malicious dependency in `uv sync`) therefore
# cannot use the job's GITHUB_TOKEN to push code or otherwise escalate.
permissions:
  contents: read

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.15 matches the runtime image (Dockerfile python:3.15-slim);
        # 3.12 guards the oldest supported interpreter (requires-python >=3.12).
        python-version: ["3.12", "3.15"]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format . --check

      - name: Run ty
        run: uv run ty check aperisolve

      - name: Run pytest
        # Floor set just under the current ~60% so coverage can only ratchet up.
        run: uv run pytest -q --cov=aperisolve --cov-fail-under=55

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit --no-deps -r requirements-audit.txt

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
