name: Docker Image CI

on:
  push:
    branches:
      - main
    tags:
      - '*'

jobs:
  # Deploy gate: a tag must never ship code that fails lint/type/tests. Kept
  # to one Python version for speed; the full matrix (and pip-audit, which can
  # go red on advisories unrelated to the release) stays in lint.yml.
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync Python dependencies
        run: uv sync --frozen --extra dev

      - name: Lint, type-check and test
        run: |
          uv run ruff check .
          uv run ruff format . --check
          uv run ty check aperisolve
          uv run pytest -q --cov=aperisolve --cov-fail-under=55

  docker-releases:
    runs-on: ubuntu-latest
    needs: tests

    env:
      RELEASE_VERSION: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on tag)
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: |
            ghcr.io/zeecka/aperisolve:${{ env.RELEASE_VERSION }}
            ghcr.io/zeecka/aperisolve:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-releases
    if: startsWith(github.ref, 'refs/tags/')
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for image availability in registry
        run: |
          for i in $(seq 1 30); do
            if docker manifest inspect "ghcr.io/zeecka/aperisolve:${{ github.ref_name }}" > /dev/null 2>&1; then
              echo "Image ghcr.io/zeecka/aperisolve:${{ github.ref_name }} is available."
              exit 0
            fi
            echo "Image not yet available, retrying in 10s... ($i/30)"
            sleep 10
          done
          echo "Image still not available after 300s." >&2
          exit 1

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/AperiSolve

            # Deploy the tagged commit, not whatever main currently is:
            # compose files and site_content must match the image being run.
            git fetch --force --tags origin
            git checkout --force "${{ github.ref_name }}"

            cat .env.example | grep -v '^PROJECT_VERSION=' > .env
            cat <<EOF >> .env
            PROJECT_VERSION=${{ github.ref_name }}
            WEB_APP_PORT=${{ vars.WEB_APP_PORT }}
            MAX_CONTENT_LENGTH=${{ vars.MAX_CONTENT_LENGTH }}
            MAX_PENDING_TIME=${{ vars.MAX_PENDING_TIME }}
            MAX_STORE_TIME=${{ vars.MAX_STORE_TIME }}
            CLEAR_AT_RESTART=${{ vars.CLEAR_AT_RESTART }}
            SKIP_IHDR_FILL=${{ vars.SKIP_IHDR_FILL }}
            REMOVAL_MIN_AGE_SECONDS=${{ vars.REMOVAL_MIN_AGE_SECONDS }}
            GOOGLE_ADS_TXT=${{ vars.GOOGLE_ADS_TXT }}
            CUSTOM_EXTERNAL_SCRIPT=${{ vars.CUSTOM_EXTERNAL_SCRIPT }}
            SITE_BASE_URL=${{ vars.SITE_BASE_URL }}
            ADSENSE_CLIENT=${{ vars.ADSENSE_CLIENT }}
            ADSENSE_SLOT_INDEX=${{ vars.ADSENSE_SLOT_INDEX }}
            ADSENSE_SLOT_RESULT=${{ vars.ADSENSE_SLOT_RESULT }}
            ADSENSE_SLOT_WIKI=${{ vars.ADSENSE_SLOT_WIKI }}
            ADSENSE_SLOT_WIKI_SIDEBAR=${{ vars.ADSENSE_SLOT_WIKI_SIDEBAR }}
            ADSENSE_SLOT_WIKI_ARTICLE=${{ vars.ADSENSE_SLOT_WIKI_ARTICLE }}
            FLASK_DEBUG=${{ vars.FLASK_DEBUG }}
            RQ_DASHBOARD_REDIS_URL=${{ vars.RQ_DASHBOARD_REDIS_URL }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            DB_URI=${{ secrets.DATABASE_URL }}
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_TRACES_SAMPLE_RATE=${{ vars.SENTRY_TRACES_SAMPLE_RATE }}
            SENTRY_PROFILES_SAMPLE_RATE=${{ vars.SENTRY_PROFILES_SAMPLE_RATE }}
            SENTRY_RELEASE=${{ github.ref_name }}
            SENTRY_ENVIRONMENT=${{ vars.SENTRY_ENVIRONMENT }}
            EOF

            # compose.prod.yml bind-mounts deployment-local site content
            # (promo banner, ...) kept out of the public image; it is applied
            # only here, never for self-hosted `docker compose up`.
            docker compose -f compose.yml -f compose.prod.yml pull
            # No -v here: volumes hold the database and stored results.
            docker compose -f compose.yml -f compose.prod.yml down
            docker compose -f compose.yml -f compose.prod.yml up -d
            docker image prune -f
