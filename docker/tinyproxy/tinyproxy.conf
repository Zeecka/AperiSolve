# Base config; entrypoint.sh generates the Filter list from SENTRY_DSN at
# container start (the ingest host is only known once an operator's .env is
# in play, not at image-build time).
Port 8888
Listen 0.0.0.0
Timeout 60
MaxClients 20
LogLevel Warning

# Default-deny allow-list: only hosts entrypoint.sh writes to this file may be
# reached. An unset/unparsable SENTRY_DSN leaves the file empty, so the proxy
# fails closed (reaches nothing) instead of open.
Filter "/tmp/sentry-filter.list"
FilterType fnmatch
FilterDefaultDeny Yes
